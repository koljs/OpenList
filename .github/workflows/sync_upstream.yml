name: Sync Upstream

on:
  schedule:
    - cron: "0 4 * * *" # 每天 UTC 4:00 (北京时间 12:00) 自动同步
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync from upstream OpenListTeam/OpenList
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          # 使用 PAT 以便推送包含工作流文件改动的合并提交
          # GITHUB_TOKEN 无权推送工作流文件，必须用 PAT
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/OpenListTeam/OpenList.git
          git fetch upstream

      - name: Merge upstream/main
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # --allow-unrelated-histories: fork 的 main 历史上曾是孤儿快照分支，
          # 与 upstream 无共同祖先，普通 merge 会被 git 拒绝（refusing to merge unrelated histories）
          if ! git merge upstream/main --no-edit --allow-unrelated-histories; then
            echo "::warning::Merge conflicts detected, auto-resolving..."

            # 获取所有冲突文件列表并逐个解决
            # （while read 形式，避免 shell 差异导致的分词问题，且兼容含空格的路径）
            echo "Conflicting files:"
            git diff --name-only --diff-filter=U

            while IFS= read -r file; do
              if [[ "$file" == .github/workflows/* ]]; then
                # 对 .github/workflows/ 下的冲突文件保留 fork 版本（ours），
                # 因为 fork 有自定义的 CI 修改（DockerHub 条件跳过、GHCR 命名空间、本同步工作流等）
                echo "  $file: keeping fork version (ours)"
                git checkout --ours "$file"
              elif [[ "$file" == drivers/all.go ]]; then
                # 驱动注册表：以上游版本为准（保留 guangyapan 等上游驱动），
                # 但必须补回我们的扫码驱动 guangya 的注册，否则驱动会从列表中消失
                echo "  $file: using upstream version + re-register guangya"
                git checkout --theirs "$file"
                if ! grep -q 'v4/drivers/guangya"' "$file"; then
                  if grep -q 'v4/drivers/google_photo' "$file"; then
                    sed -i '\#v4/drivers/google_photo#a\	_ "github.com/OpenListTeam/OpenList/v4/drivers/guangya"' "$file"
                  elif grep -q 'v4/drivers/halalcloud' "$file"; then
                    sed -i '\#v4/drivers/halalcloud#i\	_ "github.com/OpenListTeam/OpenList/v4/drivers/guangya"' "$file"
                  else
                    echo "::error::Cannot find anchor to re-register guangya in $file"
                    exit 1
                  fi
                fi
              else
                # 其他文件跟随上游，保持功能与上游一致
                echo "  $file: using upstream version (theirs)"
                git checkout --theirs "$file"
              fi
              git add "$file"
            done < <(git diff --name-only --diff-filter=U)

            # 完成合并提交
            git commit --no-edit
            echo "Conflicts auto-resolved."
          fi

      - name: Verify fork customizations
        run: |
          # 硬性校验：扫码驱动文件与注册必须保留，失败则中止且不推送
          test -f drivers/guangya/driver.go || { echo "::error::drivers/guangya/driver.go lost!"; exit 1; }
          test -f drivers/guangya/util.go   || { echo "::error::drivers/guangya/util.go lost!"; exit 1; }
          grep -q 'v4/drivers/guangya"' drivers/all.go || { echo "::error::guangya registration lost in drivers/all.go!"; exit 1; }
          echo "Fork customizations verified."

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify build
        run: go build ./...

      - name: Push changes
        run: |
          git push origin main

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::Sync upstream failed. Manual resolution may be required."
          echo "Steps to resolve:"
          echo "1. git fetch upstream"
          echo "2. git merge upstream/main --allow-unrelated-histories"
          echo "3. Resolve conflicts: keep .github/workflows ours; for drivers/all.go use upstream then re-add guangya import"
          echo "4. Verify: test -f drivers/guangya/driver.go && grep guangya drivers/all.go && go build ./..."
          echo "5. git push origin main"
